name: Verify Noahs
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Tests, TypeScript, lint and Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install the pinned pnpm directly
        uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run service and workbook tests
        run: node tests/security-workbook.mjs
      - name: Type-check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Lint
        run: npx eslint lib/noahs/xlsx.ts tests/security-workbook.mjs
      - name: Build for Cloudflare Workers
        run: npm run build
