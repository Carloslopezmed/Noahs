name: Verify Noahs
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Tests, TypeScript, lint and Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install dependencies with project script
        run: npm run install:ci
      - name: Run service and workbook tests
        run: node tests/run.mjs
      - name: Type-check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build for Cloudflare Workers
        run: npm run build
